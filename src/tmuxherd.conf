# tmuxherd's own tmux server configuration.
# tmuxherd starts its server with `tmux -L <name> -f <this file>`, so the user's
# ~/.tmux.conf (plugins, resurrect/continuum, key bindings) is never loaded here.

# Ownership marker. Only a server started with this file carries it; tmuxherd
# refuses to manage any server on its socket that lacks it (DECISIONS D16).
set -g @tmuxherd_owner 1

# Keep dead agent panes on screen so their last output and exit status stay visible.
set -g remain-on-exit on
set -g history-limit 20000
set -g default-terminal "tmux-256color"
set -g default-size "160x45"
set -g focus-events on
set -g mouse on
set -s escape-time 10
# Agent windows keep their spawn name.
set -g allow-rename off
setw -g automatic-rename off
set -g status-style "bg=colour236,fg=colour250"
set -g status-left "[tmuxherd] "
